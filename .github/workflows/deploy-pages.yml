name: Deploy to Pages

# Replaces Pages' built-in "deploy from branch" so assets can be
# cache-busted at deploy time (see scripts/stamp-version.js). Requires
# Settings -> Pages -> Source = "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling so a data-refresh
# commit landing mid-deploy still ships.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Only what's actually served — keeps .git (which carries a large
      # events.json history) out of the uploaded artifact.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          cp -r data _site/

      - name: Stamp asset version
        run: node scripts/stamp-version.js _site "${GITHUB_SHA::8}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
